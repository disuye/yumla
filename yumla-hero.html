<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>yumla</title>
  <link rel="icon" href="https://assets.bigcartel.com/account_favicons/265167/yumla-fav.png?auto=format&fit=max&h=32&w=32" type="image/png">

  <!-- Fonts (same request the original page makes): Doto = pixel-dot display, Old Standard TT = serif UI/body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Doto:300,400,500,700|Old+Standard+TT:400,700&display=swap">

  <!-- Splide -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide-core.min.css">

  <style>
    :root {
      --header-font: "Doto", monospace;
      --body-font: "Old Standard TT", Georgia, serif;
      --accent: #FF6700;            /* theme link-hover / button-hover orange */
      --overlay: rgba(0, 0, 0, .55); /* darkening layer over the photos */
      --header-pad-x: clamp(1rem, 4vw, 2.5rem);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: var(--body-font);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Header: logo left, utility nav right, floated over the hero ---------- */
    .header {
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 10;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 1.5rem var(--header-pad-x);
    }
    .logo a { display: block; line-height: 0; }
    .store-logo {
      height: clamp(52px, 8vw, 72px);   /* logo is ~105px wide in the screenshot */
      width: auto;
      display: block;
    }

    .utility ul {
      list-style: none;
      margin: 0; padding: 0;
      display: flex;
      align-items: center;
      gap: clamp(1.25rem, 3.5vw, 2.5rem);
      /* align icon row with the vertical middle of the logo */
      height: clamp(52px, 8vw, 72px);
    }
    .utility a, .utility button {
      color: #fff;
      text-decoration: none;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      font-family: var(--body-font);
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .04em;
    }
    .utility a:hover, .utility button:hover { color: var(--accent); }
    .utility svg { display: block; fill: currentColor; }
    .open-search-button svg { width: 20px; height: 20px; }
    .cart-link svg { width: 20px; height: 20px; }
    .header-divider { margin: 0 .1rem; font-weight: 400; }
    .currency_code { margin-right: .3em; }
    .open-mobile-navigation svg { width: 28px; height: 18px; }

    /* ---------- Hero: Splide fade carousel + overlay + centred text ---------- */
    .welcome_image {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    .home-carousel,
    .home-carousel .splide__track,
    .home-carousel .splide__list,
    .home-carousel .splide__slide { height: 100%; }
    .home-carousel .splide__slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    /* original theme hides the dot pagination */
    .splide__pagination { display: none; }

    .welcome_overlay {
      position: absolute;
      inset: 0;
      background: var(--overlay);
      pointer-events: none;
      z-index: 2;
    }

    .welcome_text {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;   /* sits just below centre in the screenshot */
      text-align: center;
      margin-top: -1rem;
    }
    .welcome-subheader {
      font-family: var(--header-font);
      font-weight: 400;
      text-transform: uppercase;
      font-size: clamp(.75rem, 1.5vw, 1.1rem);
      letter-spacing: .3em;
      margin-bottom: 0.4rem;
    }
    .welcome-header {
      font-family: var(--header-font);
      font-weight: 700;
      text-transform: uppercase;
      font-size: clamp(1.25rem, 3.7vw, 2.75rem);
      line-height: 1;
      letter-spacing: .28em;
      word-spacing: .15em;
      margin-bottom: 1.5rem;
    }
    .welcome_button {
      /* display: inline-block; */
      display: none;
      color: #fff;
      background: transparent;
      border: 1px solid #fff;
      border-radius: .5rem;     
      padding: 1rem 1.6rem;
      font-family: var(--body-font);
      font-size: 1rem;
      letter-spacing: .04em;
      text-decoration: none;
      transition: opacity .2s ease;
    }
    .welcome_button:hover { opacity: .8; }
    .welcome_image .welcome-subheader {
      font-family: var(--header-font);
      font-weight: 600;
      letter-spacing: 0.2em;
      line-height: 1.25em;
      margin-right: -0.2em;
      padding: 0 16px 24px 16px;
      text-transform: uppercase;
      font-size: 16px;
    }
    @media screen and (min-width: 320px)  { .welcome_image .welcome-subheader { font-size: calc(16px + 4 * ((100vw - 320px) / 880)); } }
    @media screen and (min-width: 1200px) { .welcome_image .welcome-subheader { font-size: 20px; } }
    @media only screen and (max-width: 800px) { .welcome_image .welcome-subheader { letter-spacing: 0.1em; margin-right: -0.1em; } }
 
    .welcome_image .welcome-header {
      font-family: var(--header-font);
      font-weight: bold;
      letter-spacing: 0.2em;
      line-height: 1.3em;
      margin: 0 -0.2em 24px 0;
      text-transform: uppercase;
      font-size: 20px;
    } 
    @media screen and (min-width: 320px)  { .welcome_image .welcome-header { font-size: calc(20px + 40 * ((100vw - 320px) / 880)); } }
    @media screen and (min-width: 1200px) { .welcome_image .welcome-header { font-size: 60px; } }
    @media only screen and (max-width: 800px) {
      .welcome_image .welcome-header { letter-spacing: 0.1em; padding: 0 16px; white-space: normal; }
    }
  </style>
</head>

  <script>
    // Mirrors the theme's options: homepageSlideshowTransition "fade", autoplay on, speed 3000 ms
    const splide = new Splide('.home-carousel', {
      type: 'fade',
      rewind: true,
      autoplay: true,
      interval: 3000,
      speed: 1200,
      arrows: false,
      pagination: false,
      pauseOnHover: false,
      pauseOnFocus: false,
      drag: false,
    }).mount();

    // "Yes 係" button: theme option welcomeButtonBehavior = "scroll" (scrolls to the content below the hero)
    document.querySelector('.welcome_button').addEventListener('click', (e) => {
      e.preventDefault();
      const next = document.querySelector('main') || document.querySelector('.welcome_image').nextElementSibling;
      if (next) next.scrollIntoView({ behavior: 'smooth' });
    });
  </script>
